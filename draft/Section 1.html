<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STATtion</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #c7d2db;
            color: #0b186e;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 60px 20px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.its.ac.id/sb/wp-content/uploads/sites/55/2022/04/IMG_4197-2-scaled.jpg') center/cover no-repeat;
            opacity: 0.2; 
            z-index: 1;
        }

        .hero .container {
            position: relative;
            z-index: 2;
        }

        .hero-tag {
            font-size: 14px;
            color: #000000;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            line-height: 54px;
        }

        .highlight {
            color: #3a3e60;
        }

        .hero-sub {
            font-size: 16px;
            color: #000000;
            margin-top: 16px;
        }

        .cta-main {
            background-color: #0b186e;
            border: none;
            padding: 12px 24px;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 20px;
        }

        .hero-stats {
            margin-top: 60px;
        }

        .stat-num {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 13px;
            color: #000000;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
                line-height: 38px;
            }

            .hero-sub {
                font-size: 14px;
            }

            .stat-num {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<section class="hero">
  <!-- background -->
  <div class="hero-bg"></div>

  <div class="container">
    <div class="row text-center text-md-start align-items-center">

      <div class="col-12 col-md-8 mx-auto">
        <div class="hero-tag">Kebutuhan Mahasiswa Statistika</div>

        <h1>
          It's More Than Just a Writing Tool <br>
          <span class="highlight">—It's the Start of Your Insights</span>
        </h1>

        <p class="hero-sub">
          Semua kebutuhan mahasiswa statistika dalam satu tempat—alat tulis, buku, dan lainnya.<br>
          Belanja mudah untuk semua langkah analisimu.
        </p>

        <button class="cta-main">Mulai Belanja →</button>
      </div>


    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
