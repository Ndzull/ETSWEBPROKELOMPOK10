<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WHY STATtion?</title>
 
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
 
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .why-section {
      padding: 80px 20px 90px;
      background: #ffffff;
    }
 
    .why-title {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.5px;
      margin-bottom: 60px;
    }
 
    .text-box {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 1.5px solid #aaaaaa;
      background: #d9d9d9;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      color: #111827;
      line-height: 1.5;
      cursor: text;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      word-break: break-word;
    }
    .text-box:focus {
      border-color: #111827;
      background: #efefef;
    }
 
    /* ---- Card label ---- */
    .why-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: #111827;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1.5;
      margin-top: 8px;
    }
 
    /* ========== RESPONSIVE circle sizes ========== */
    @media (max-width: 991.98px) {
      .circle-wrap { width: 170px; height: 170px; }
    }
    @media (max-width: 575.98px) {
      .circle-wrap { width: 150px; height: 150px; }
      .why-section  { padding: 56px 16px 64px; }
    }
  </style>
</head>
<body>
 
<section class="why-section">
  <div class="container">
 
    <h2 class="why-title text-center">WHY STATtion?</h2>
 
    <!-- Cards row -->
    <div class="row justify-content-center g-4 g-lg-5">
 
      <div class="col-10 col-sm-6 col-lg-4 why-card text-center">
        <div class="text-box" contenteditable="true">
          Akses Mudah
        </div>
        <p class="why-label">Akses mudah untuk semua kebutuhan alat tulis statistikamu</p>
      </div>
 
      <div class="col-10 col-sm-6 col-lg-4 why-card text-center">
        <div class="text-box" contenteditable="true">
          Kategori Lengkap
        </div>
        <p class="why-label">Kategori lengkap untuk semua pencarianmu</p>
      </div>
 
      <div class="col-10 col-sm-6 col-lg-4 why-card text-center">
        <div class="text-box" contenteditable="true">
          Pengiriman Cepat
        </div>
        <p class="why-label">Pengiriman cepat untuk mempermudah analisismu</p>
      </div>
 
    </div>
  </div>
</section>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
