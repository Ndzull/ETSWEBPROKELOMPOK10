<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WHY STATtion?</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .why-section {
      padding: 80px 20px 90px;
    }

    .why-title {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      margin-bottom: 60px;
      text-align: center;
    }

    /* Lingkaran gambar */
    .image-box {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 16px;
      border: 1.5px solid #aaaaaa;
      background: #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .why-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 10px;
      text-align: center;
    }

    .why-label {
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
      margin-top: 6px;
      color: #374151;
    }

    @media (max-width: 991.98px) {
      .image-box { width: 170px; height: 170px; }
    }

    @media (max-width: 575.98px) {
      .image-box { width: 150px; height: 150px; }
      .why-section { padding: 56px 16px 64px; }
    }
  </style>
</head>

<body>

<section class="why-section">
  <div class="container">

    <h2 class="why-title">WHY STATtion?</h2>

    <div class="row justify-content-center g-4 g-lg-5">

      <!-- Card 1 -->
      <div class="col-10 col-sm-6 col-lg-4 text-center">
        <div class="image-box">
          <img src="https://i.pinimg.com/1200x/24/fc/42/24fc42a5b0ae66758512c4f08458dad6.jpg">
        </div>
        <h5 class="why-heading">Akses Mudah</h5>
        <p class="why-label">
          Akses mudah untuk semua kebutuhan alat tulis statistikamu
        </p>
      </div>

      <!-- Card 2 -->
      <div class="col-10 col-sm-6 col-lg-4 text-center">
        <div class="image-box">
          <img src="https://i.pinimg.com/736x/02/08/65/020865aaa1e4c1896cd36b9966ad434d.jpg">
        </div>
        <h5 class="why-heading">Kategori Lengkap</h5>
        <p class="why-label">
          Kategori lengkap untuk semua pencarianmu
        </p>
      </div>

      <!-- Card 3 -->
      <div class="col-10 col-sm-6 col-lg-4 text-center">
        <div class="image-box">
          <img src="https://i.pinimg.com/736x/3f/5b/04/3f5b044703fc9a09af3b9dbf42d890c3.jpg">
        </div>
        <h5 class="why-heading">Pengiriman Cepat</h5>
        <p class="why-label">
          Pengiriman cepat untuk mempermudah analisismu
        </p>
      </div>

    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
