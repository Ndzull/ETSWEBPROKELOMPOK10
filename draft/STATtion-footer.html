<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STATtion Footer</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f3f4f6;
      min-height: 200vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    footer {
      background: #ffffff;
      border-top: 2px solid #e5e7eb;
    }

    .footer-body {
      padding: 40px 48px 28px;
    }

    .footer-brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #111827;
      line-height: 1.35;
    }
    .footer-brand-sub {
      font-size: 0.83rem;
      color: #9ca3af;
      margin-top: 6px;
    }

    .social-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background-color: #111827;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .social-btn:hover {
      background-color: #374151;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .footer-heading {
      font-size: 1rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 14px;
    }

    .footer-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .footer-links li + li { margin-top: 7px; }
    .footer-links a {
      font-size: 0.875rem;
      color: #6b7280;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: #111827; }


    .contact-org {
      font-size: 0.875rem;
      font-weight: 700;
      color: #111827;
    }
    .contact-detail {
      font-size: 0.82rem;
      color: #6b7280;
      line-height: 1.75;
    }

    .footer-bottom {
      border-top: 1px solid #e5e7eb;
      padding: 14px 48px;
    }
    .footer-copy {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .btn-top {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid #d1d5db;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #374151;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-top:hover {
      border-color: #111827;
      color: #111827;
      transform: translateY(-2px);
    }

    @media (max-width: 767.98px) {
      .footer-body  { padding: 28px 20px 20px; }
      .footer-bottom { padding: 12px 20px; }
      .footer-brand-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>


<footer>

  <div class="footer-body">
    <div class="row g-4">

      <div class="col-12 col-sm-6 col-lg-4">
        <p class="footer-brand-title">STATtion's with<br>Integrated System</p>
        <p class="footer-brand-sub">STATtion mendominasi</p>

        <div class="d-flex gap-2 mt-4 mt-lg-5">
          <!-- Discord -->
          <a href="#" class="social-btn" title="Discord">
            <i class="bi bi-discord"></i>
          </a>
          <!-- WhatsApp -->
          <a href="#" class="social-btn" title="WhatsApp">
            <i class="bi bi-whatsapp"></i>
          </a>
          <!-- Instagram -->
          <a href="#" class="social-btn" title="Instagram">
            <i class="bi bi-instagram"></i>
          </a>
          <!-- TikTok -->
          <a href="#" class="social-btn" title="TikTok">
            <i class="bi bi-tiktok"></i>
          </a>
        </div>
      </div>

      <!-- COL 2 : Quick Links -->
      <div class="col-6 col-sm-3 col-lg-2">
        <p class="footer-heading">Quick Links</p>
        <ul class="footer-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Kategori</a></li>
          <li><a href="#">Chatbox</a></li>
        </ul>
      </div>

      <!-- COL 3 : Sponsors -->
      <div class="col-6 col-sm-3 col-lg-3">
        <p class="footer-heading">Sponsors</p>
        <div class="d-flex flex-column gap-3">

        </div>
      </div>

      <!-- COL 4 : Contact -->
      <div class="col-12 col-sm-6 col-lg-3">
        <p class="footer-heading">Contact</p>
        <p class="contact-org">STATtion</p>
        <a href="https://maps.app.goo.gl/GKJ3hAJn6wvNafHJA" class="contact-detail" target="_blank">
          Business Statistics<br>
          Departement<br>
          3nd Floor<br>
          Jl. Raya ITS, Sukolilo,<br>
          Surabaya 60111
        </a>
      </div>

    </div>
  </div>

  <!-- ---- BOTTOM BAR ---- -->
  <div class="footer-bottom d-flex align-items-center justify-content-between">
    <span class="footer-copy">©STATtion 2026</span>
    <a href="#" class="btn-top" title="Kembali ke atas"
       onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">
      <i class="bi bi-chevron-up fw-bold"></i>
    </a>
  </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
